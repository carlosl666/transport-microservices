spring.application.name=microservice-assignments
server.port=8083
server.servlet.context-path=/api/v1

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/order_db
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:12345}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=true
logging.level.org.hibernate.SQL=debug
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
spring.cloud.openfeign.httpclient.hc5.enabled=true
driver.micro.url=${DRIVER_SERVICE_URL:http://localhost:8081}
order.micro.url=${ORDER_SERVICE_URL:http://localhost:8082}

feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=10000
feign.client.config.default.loggerLevel=basic

file.upload.dir=${UPLOAD_DIR:/app/uploads}

management.endpoints.web.exposure.include=health,info

springdoc.swagger-ui.path=/swagger-ui.html